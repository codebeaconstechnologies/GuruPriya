    <script>
      (function () {
        var el = document.getElementById("gp-intro");
        if (!el) return;
        var root = document.documentElement;
        function done() {
          if (el.parentNode) el.parentNode.removeChild(el);
          root.classList.remove("gp-intro");
          removeEventListener("keydown", skip);
        }
        if (!root.classList.contains("gp-intro")) return done();
        function skip() {
          el.classList.add("gpi-skip");
          setTimeout(done, 260);
        }
        el.addEventListener("click", skip);
        addEventListener("keydown", skip);
        el.addEventListener("animationend", function (e) { if (e.target === el) done(); });
        setTimeout(done, 2200); // safety net
      })();
    </script>
