    <!--
      Opening intro: a GuruPriya coach drives in at sunset, then the scene lifts
      like a curtain (~1.7s). Plays only on a real page load of the home page
      (typed URL, link from outside, refresh) — never on in-app navigation such
      as clicking the logo, never on back/forward, never with reduced motion,
      and never without JavaScript. Click/tap or any key skips it.
    -->
    <script>
      (function () {
        try {
          var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
          if (nav && nav.type === "back_forward") return;
          if (location.pathname !== "/" && location.pathname !== "/index.html") return;
          if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          document.documentElement.classList.add("gp-intro");
        } catch (e) {}
      })();
    </script>
